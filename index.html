<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Octopus Verticales</title>
  <meta name="description" content="App interna de Octopus Verticales: trabajos, fotos, notas, clima, muro y organización del equipo.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Octopus">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="btn-menu" aria-label="Abrir menú"></button>
      <div class="topbar-title" id="topbar-title">Octopus Verticales</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <nav class="drawer" id="drawer" aria-label="Navegación principal">
      <div class="drawer-head">
        <img src="icons/icon.svg" alt="" width="40" height="40">
        <div>
          <div class="drawer-brand">Octopus Verticales</div>
          <div class="drawer-user" id="drawer-user"></div>
        </div>
      </div>
      <div class="drawer-links" id="drawer-links"></div>
      <div class="drawer-foot">
        <span id="sync-status" class="sync-status">Modo local</span>
        <span class="version">v1.2.0</span>
      </div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <main class="view" id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Accesos rápidos"></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
